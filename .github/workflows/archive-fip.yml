name: Archive FIP to Filecoin

on:
  issue_comment:
    types: [created]

# Only run on comments containing "FIP approved"
jobs:
  archive:
    if: |
      contains(github.event.comment.body, 'FIP approved') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-22.04

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub CLI
        run: |
          # GitHub CLI is pre-installed on ubuntu-22.04
          gh --version

      - name: Install filecoin-pin CLI
        run: |
          npm install -g filecoin-pin
          filecoin-pin --version

      - name: Setup payment configuration
        env:
          PRIVATE_KEY: ${{ secrets.FILECOIN_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.FILECOIN_RPC_URL || 'https://api.calibration.node.glif.io/rpc/v1' }}
        run: |
          echo "Checking payment status..."
          filecoin-pin payments status || echo "No existing payment configuration"

      - name: Extract FIP number from issue
        id: extract
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "Archiving FIP from issue #$ISSUE_NUMBER"

      - name: Archive FIP data
        id: archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.FILECOIN_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.FILECOIN_RPC_URL || 'https://api.calibration.node.glif.io/rpc/v1' }}
        run: |
          # Run the archive script
          node scripts/archive-fip.js \
            --issue ${{ steps.extract.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --output ./fip-${{ steps.extract.outputs.issue_number }}-archive

          # Extract verification data
          if [ -f ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json ]; then
            PIECE_CID=$(jq -r '.pieceCid' ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json)
            ROOT_CID=$(jq -r '.rootCid' ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json)
            TX_HASH=$(jq -r '.transactionHash' ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json)
            DATASET_ID=$(jq -r '.dataSetId' ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json)
            DOWNLOAD_URL=$(jq -r '.downloadUrl' ./fip-${{ steps.extract.outputs.issue_number }}-archive/verification.json)

            echo "piece_cid=$PIECE_CID" >> $GITHUB_OUTPUT
            echo "root_cid=$ROOT_CID" >> $GITHUB_OUTPUT
            echo "tx_hash=$TX_HASH" >> $GITHUB_OUTPUT
            echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
            echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

            echo "✅ Archive uploaded successfully"
            echo "Piece CID: $PIECE_CID"
            echo "Transaction: $TX_HASH"
          else
            echo "❌ verification.json not found"
            exit 1
          fi

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fip-${{ steps.extract.outputs.issue_number }}-archive
          path: ./fip-${{ steps.extract.outputs.issue_number }}-archive/
          retention-days: 90

      - name: Comment with verification details
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue_number }};
            const pieceCid = '${{ steps.archive.outputs.piece_cid }}';
            const rootCid = '${{ steps.archive.outputs.root_cid }}';
            const txHash = '${{ steps.archive.outputs.tx_hash }}';
            const datasetId = '${{ steps.archive.outputs.dataset_id }}';
            const downloadUrl = '${{ steps.archive.outputs.download_url }}';

            const comment = `## ✅ FIP Archive Complete

            This FIP has been archived to the Filecoin network with cryptographic proof of storage.

            ### 📦 Archive Details

            - **Issue:** #${issueNumber}
            - **Repository:** ${{ github.repository }}
            - **Archived:** ${new Date().toISOString()}

            ### 🔗 Filecoin Verification

            | Field | Value |
            |-------|-------|
            | **Piece CID** | \`${pieceCid}\` |
            | **Root CID** | \`${rootCid}\` |
            | **Data Set ID** | ${datasetId} |
            | **Transaction** | [\`${txHash.substring(0, 10)}...\`](https://calibration.filfox.info/tx/${txHash}) |

            ### 📥 Access Archive

            - **🌐 IPFS Gateway:** [View on ipfs.io](https://ipfs.io/ipfs/${rootCid}/index.html)
            - **🌐 Alternative Gateway:** [View on dweb.link](https://dweb.link/ipfs/${rootCid}/index.html)
            - **💾 Direct Download:** [Download CAR file](${downloadUrl})
            - **🔍 Blockchain Explorer:** [Transaction Details](https://calibration.filfox.info/tx/${txHash})
            - **📦 GitHub Artifact:** Available in [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > **Note:** All links within the archive (PRs, diffs, comments) work when viewed via IPFS gateways!

            ### 🔍 Verify Storage

            You can verify this archive using the filecoin-pin CLI:

            \`\`\`bash
            # Check data set details
            filecoin-pin data-set ${datasetId}

            # Download and verify the archive
            curl -o archive.car "${downloadUrl}"
            ipfs-car ls archive.car
            \`\`\`

            ### 📋 Archive Contents

            The archive includes:
            - ✓ Original issue and description
            - ✓ All comments and discussion
            - ✓ Linked pull requests and code changes
            - ✓ Self-contained HTML with clickable links
            - ✓ Verification metadata

            ---

            🤖 *This archive was created automatically by the [FIP Archival System](https://github.com/${{ github.repository }})*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: Create job summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🎉 FIP Archive Complete!

          ### Archive Details
          - **Issue:** #${{ steps.extract.outputs.issue_number }}
          - **Piece CID:** `${{ steps.archive.outputs.piece_cid }}`
          - **Root CID:** `${{ steps.archive.outputs.root_cid }}`
          - **Transaction:** [`${{ steps.archive.outputs.tx_hash }}`](https://calibration.filfox.info/tx/${{ steps.archive.outputs.tx_hash }})

          ### Verification Links
          - [View on Explorer](https://calibration.filfox.info/tx/${{ steps.archive.outputs.tx_hash }})
          - [Download Archive](${{ steps.archive.outputs.download_url }})

          ### Next Steps
          The FIP archive is now permanently stored on Filecoin with ongoing cryptographic proofs.
          EOF

  # Handle errors gracefully
  on-failure:
    runs-on: ubuntu-22.04
    needs: archive
    if: failure()

    permissions:
      issues: write

    steps:
      - name: Comment on failure
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number }};

            const comment = `## ⚠️ FIP Archive Failed

            The automatic archival process encountered an error.

            ### 🔍 Troubleshooting

            Common issues:
            - Missing or invalid \`FILECOIN_PRIVATE_KEY\` secret
            - Insufficient USDFC tokens for storage deposit
            - GitHub API rate limiting

            ### 🛠️ Manual Archive

            You can manually archive this FIP using:

            \`\`\`bash
            node scripts/archive-fip.js --issue ${issueNumber} --repo ${{ github.repository }}
            \`\`\`

            ### 📊 Workflow Details

            - **Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Repository:** ${{ github.repository }}

            Please check the workflow logs for detailed error information.

            ---

            🤖 *Automated message from the [FIP Archival System](https://github.com/${{ github.repository }})*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
